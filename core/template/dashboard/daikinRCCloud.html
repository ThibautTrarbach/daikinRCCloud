<!--
  Dashboard widget for daikinRCCloud — inspired by DaikinOnlineCtrl (AGPL, Masterfion & A.Barrau).
  Adapted for ONECTA MQTT commands (_onOffMode, _operationMode, …).
-->
<script type="text/javascript">
var _styleBtnDisabledDRC = "color:#ADADAD!important;";

function DRCexecCmd(_id, _opts) {
	if (!_id) { return; }
	var opts = _opts || {};
	opts.fromWidget = '1';
	jeedom.cmd.execute({id: _id, value: opts, notify: true});
}

function DRCexecListItem(_item) {
	if (!_item || !_item.id) { return; }
	if (_item.exec === 'select') {
		DRCexecCmd(_item.id, {select: _item.v});
	} else if (_item.exec === 'slider') {
		DRCexecCmd(_item.id, {slider: _item.v});
	} else {
		DRCexecCmd(_item.id, {});
	}
}

function DRCmodeColor(_mode, _tRoom, _tSet) {
	var m = String(_mode || '').toLowerCase();
	var room = parseFloat(_tRoom);
	var set = parseFloat(_tSet);
	if (m === 'cooling' || ((!isNaN(room) && !isNaN(set) && room > set) && (m === 'auto'))) {
		return {cls: 'DRC_btn-bleu', style: 'border-color:#3F2790!important;color:#3F2790!important;'};
	}
	if (m === 'heating' || ((!isNaN(room) && !isNaN(set) && set >= room) && (m === 'auto'))) {
		return {cls: 'DRC_btn-rouge', style: 'border-color:#F09797!important;color:#F09797!important;'};
	}
	if (m === 'dry') {
		return {cls: 'DRC_btn-vert', style: 'border-color:#83F483!important;color:#83F483!important;'};
	}
	if (m === 'fanonly' || m === 'fan_only') {
		return {cls: 'DRC_btn-jaune', style: 'border-color:#F9F953!important;color:#F9F953!important;'};
	}
	return {cls: 'DRC_btn-active', style: 'border-color:#3F2790!important;color:#3F2790!important;'};
}

function DRCsetPow(_eq, _pow, _offId, _onId) {
	var $pow = $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zPow');
	$pow.off('click');
	if (_pow === '-1') { return; }
	if (_pow === '1') {
		$pow.attr('data-cmd_id', _offId).on('click', function() { DRCexecCmd($(this).attr('data-cmd_id'), {}); })
			.children().removeClass('btn-danger').addClass('btn-success')
			.attr('style', 'color:#FFFFFF!important;background-color:#5CB85C!important;border-color:#4CAE4C!important;');
	} else {
		$pow.attr('data-cmd_id', _onId).on('click', function() { DRCexecCmd($(this).attr('data-cmd_id'), {}); })
			.children().removeClass('btn-success').addClass('btn-danger')
			.attr('style', 'color:#FFFFFF!important;background-color:#D9534F!important;border-color:#D43F3A!important;');
	}
}

function DRCsetSubMenu(_eq, _menuId, _typeClass, _active, _list, _pow) {
	var $menu = $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zMenuAct[drc-menuId="' + _menuId + '"]');
	var $tab = $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_onglet-menu[drc-menuId="' + _menuId + '"]');
	$menu.empty();
	if (!_list || !_list.length) {
		$tab.hide();
		$menu.hide();
		return;
	}
	$tab.show();
	var n = Math.min(_list.length, 8);
	for (var i = 0; i < n; i++) {
		var item = _list[i];
		var $btn = $('<span class="cmd DRC_btn-menu-tabs ' + _typeClass + '" data-cmd_id="' + item.id + '" drc-val="' + item.v + '" title="' + item.txt + '"></span>');
		$btn.data('drcItem', item);
		var style = (_pow == 1) ? '' : _styleBtnDisabledDRC;
		$btn.append('<a class="btn btn-circle DRC_btn-menu" style="' + style + '">' + item.icone + '</a>');
		$menu.append($btn);
		if (String(item.v) === String(_active)) {
			$tab.html(item.icone);
			if (_pow == 1) {
				$btn.find('a').addClass('disabled DRC_btn-active').attr('style', 'border-color:#3F2790!important;color:#3F2790!important;');
			}
		}
	}
	$menu.find('.cmd').off('click').on('click', function() {
		DRCexecListItem($(this).data('drcItem'));
	});
}

function DRCsetMenu(_eq, _pow, _idMenu) {
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zMenuAct').css({display: 'none'});
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_onglet-menu').removeClass('DRC_Menu-active-on DRC_Menu-active-off').addClass('cursor')
		.off('click').on('click', function() { DRCsetMenu(_eq, _pow, $(this).attr('drc-menuId')); });
	var act = (_pow == 1) ? 'on' : 'off';
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_onglet-menu[drc-menuId="' + _idMenu + '"]').addClass('DRC_Menu-active-' + act).removeClass('cursor').off('click');
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zMenuAct[drc-menuId="' + _idMenu + '"]').css({display: 'table'});
}

function DRCsetTemperature(_eq, _pow, _sliderId, _val, _step) {
	var html = _val;
	if (parseFloat(_val) > 0 && parseInt(_val, 10) != _val) {
		var parts = String(parseFloat(_val)).split('.');
		html = parts[0] + "<span style='font-size:60%;'>." + (parts[1] || '0') + "</span>°";
	} else if (_val !== '' && _val !== null) {
		html = _val + '°';
	} else {
		html = '?';
	}
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ConsigneTemp').attr('data-tempval', _val).html(html);
	var step = parseFloat(_step) || 0.5;
	var $btns = $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp');
	$btns.off('click');
	if (_pow != 1) {
		$btns.attr('style', _styleBtnDisabledDRC);
	} else {
		$btns.attr('style', '');
	}
	if (!_sliderId || !(parseFloat(_val) > 0 || _val === '0' || _val === 0)) {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="+"], .eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="-"]').hide();
		return;
	}
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="+"]').show().parent().attr('data-cmd_id', _sliderId);
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="-"]').show().parent().attr('data-cmd_id', _sliderId);
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="+"]').on('click', function() {
		var v = parseFloat($('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ConsigneTemp').attr('data-tempval')) + step;
		DRCexecCmd(_sliderId, {slider: v});
	});
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="-"]').on('click', function() {
		var v = parseFloat($('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ConsigneTemp').attr('data-tempval')) - step;
		DRCexecCmd(_sliderId, {slider: v});
	});
}

function DRCsetPowerful(_eq, _pow, _kind, _powerful, _offId, _onId, _stemp) {
	var $p = $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="P"]');
	$p.off('click').hide();
	if (_pow != 1 || !_offId || !_onId) { return; }
	$p.show().parent().attr('data-cmd_id', (_powerful === '1') ? _offId : _onId);
	if (_powerful === '1') {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ConsigneTemp').html('P');
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="+"], .eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="-"]').hide();
	}
	$p.on('click', function() {
		DRCexecCmd($(this).parent().attr('data-cmd_id'), {});
	});
}

function DRCsetInfo(_eq, _sensors, _valOff) {
	$.each(_sensors, function(k, s) {
		if (s.kcmd === '1') {
			var value = (s.v === false) ? _valOff : s.v;
			$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_z' + s.n + 'Txt').attr('title', s.txt).html(value).show();
			$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_z' + s.n + 'Label').show();
			if (s.h === '1') {
				$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_z' + s.n + 'Txt').addClass('history cursor').attr('data-cmd_id', s.id);
			}
		} else {
			$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_z' + s.n + 'Txt').hide();
			$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_z' + s.n + 'Label').hide();
			$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_z' + s.n + 'Icon').hide();
		}
	});
	if ($('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zotempTxt').is(':hidden') && $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zhtempTxt').is(':hidden')) {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zsensortempIcon').hide();
	}
	if ($('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zcurr_day_heatTxt').is(':hidden') && $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zcurr_day_coolTxt').is(':hidden')) {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zcurr_day').hide();
	}
}

function DRCsetOther(_eq, _refreshId) {
	if (_refreshId) {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_Refresh').show().off('click').on('click', function() {
			$(this).animate({color: '#00DE00'}, 800);
			DRCexecCmd(_refreshId, {});
		});
	} else {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_Refresh').hide();
	}
}

function DRCsetDesign(_eq, _bg, _color) {
	$('.eqLogic[data-eqLogic_id=' + _eq + ']').css('background-color', _bg);
	if (_bg === 'transparent') {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp, .eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ConsigneTable').addClass('DRC_border-in-transparence');
	}
}

function DRCsetZones(_eq, _zones, _activeKey, _zonesData) {
	var $bar = $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ZoneSelect');
	$bar.empty();
	if (!_zones || _zones.length <= 1) {
		$bar.hide();
		return;
	}
	$bar.show();
	for (var i = 0; i < _zones.length; i++) {
		var z = _zones[i];
		var $b = $('<a class="btn btn-xs DRC_zoneBtn" style="margin:0 2px;"></a>').text(z.label).attr('drc-zone', z.key);
		if (z.key === _activeKey) { $b.addClass('btn-primary'); } else { $b.addClass('btn-default'); }
		$bar.append($b);
	}
	$bar.find('.DRC_zoneBtn').off('click').on('click', function() {
		var key = $(this).attr('drc-zone');
		if (!_zonesData[key]) { return; }
		DRCapplyZone(_eq, key, _zones, _zonesData);
	});
}

function DRCapplyZone(_eq, _key, _zones, _zonesData) {
	var p = _zonesData[_key];
	if (!p) { return; }
	var zoneMeta = null;
	for (var i = 0; i < _zones.length; i++) {
		if (_zones[i].key === _key) { zoneMeta = _zones[i]; break; }
	}
	var kind = p.kind || (zoneMeta ? zoneMeta.kind : 'climate');
	var $root = $('.eqLogic[data-eqLogic_id=' + _eq + ']');
	$root.attr('data-drc-zone', _key).attr('data-drc-kind', kind);
	$root.find('.DRC_zoneBtn').removeClass('btn-primary').addClass('btn-default');
	$root.find('.DRC_zoneBtn[drc-zone="' + _key + '"]').removeClass('btn-default').addClass('btn-primary');

	DRCsetPow(_eq, p.pow, p.powOffId, p.powOnId);
	var roomRaw = (p.sensors && p.sensors.htemp && p.sensors.htemp.v !== false) ? parseFloat(p.sensors.htemp.v) : NaN;
	var color = (p.pow == 1) ? DRCmodeColor(p.mode, roomRaw, p.stemp) : {cls: '', style: ''};
	if (kind === 'tank') {
		$root.find('.DRC_onglet-menu[drc-menuId="2"], .DRC_onglet-menu[drc-menuId="3"]').hide();
		$root.find('.DRC_zMenuAct[drc-menuId="2"], .DRC_zMenuAct[drc-menuId="3"]').hide();
		DRCsetSubMenu(_eq, 1, 'DRC_Mode', p.mode, p.modeList, p.pow);
		DRCsetSubMenu(_eq, 4, 'DRC_Extra', '', p.extraList, p.pow);
		if (!p.modeList.length) {
			$root.find('.DRC_onglet-menu[drc-menuId="1"]').hide();
		}
	} else {
		DRCsetSubMenu(_eq, 1, 'DRC_Mode', p.mode, p.modeList, p.pow);
		DRCsetSubMenu(_eq, 2, 'DRC_FanRate', p.fanMode, p.fanRateList, p.pow);
		DRCsetSubMenu(_eq, 3, 'DRC_FanDir', p.fanH || p.fanV, p.fanDirList, p.pow);
		DRCsetSubMenu(_eq, 4, 'DRC_Extra', '', p.extraList, p.pow);
		if (p.pow == 1 && p.mode) {
			$root.find('.DRC_Mode[drc-val="' + p.mode + '"] a').addClass(color.cls).attr('style', color.style);
		}
	}
	DRCsetTemperature(_eq, p.pow, p.stempSliderId, p.stemp, p.stempStep || 0.5);
	DRCsetPowerful(_eq, p.pow, kind, p.powerful, p.powerfulOffId, p.powerfulOnId, p.stemp);
	DRCsetMenu(_eq, p.pow, 1);
	DRCsetInfo(_eq, p.sensors, 'off');
	DRCsetOther(_eq, p.refreshId);
	if (kind === 'tank') {
		$root.addClass('DRC_kind-tank').removeClass('DRC_kind-climate');
	} else {
		$root.addClass('DRC_kind-climate').removeClass('DRC_kind-tank');
	}
}

function DRCboot(_eq, _zones, _activeKey, _zonesData, _bg, _color) {
	DRCsetZones(_eq, _zones, _activeKey, _zonesData);
	DRCapplyZone(_eq, _activeKey, _zones, _zonesData);
	DRCsetDesign(_eq, _bg, _color);
}
</script>

<div class="eqLogic-widget eqLogic DRC_widget allowResize #eqLogic_class#" data-eqTyle="#eqType#" data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" style="width:#width#;border:#border#;border-radius:#border-radius#;height:#height#;color:#color#;#style#">

			<span class="DRC_zcurr_day"><div class="DRC_zcurr_day_heatTxt DRC_zcurr_dayTxt DRC_bottomborder">?</div><div class="DRC_zcurr_day_coolTxt DRC_zcurr_dayTxt">?</div></span>

				<span class="DRC_onglet-menu DRC_fanOnly" drc-menuId="3" title="Direction"><i class="fa fa-spinner"></i></span>
				<span class="DRC_onglet-menu" drc-menuId="4" title="Extras"><i class="fa fa-spinner"></i></span>

					<div style="display:table;height:30px;">

							<span class="cmd"><a class="btn btn-circle DRC_btn-temp" drc-val="+"><i class="fa fa-plus"></i></a></span>
							<span class="cmd"><a class="btn btn-circle DRC_btn-temp" drc-val="-"><i class="fa fa-minus"></i></a></span>
							<span class="cmd"><a class="btn btn-circle DRC_btn-temp" drc-val="P"><i class="loisir loisir-runner5"></i></a></span>
						</span>

				</span>

		<div class="DRC_Zone3">
			<div class="DRC_zMenuAct" drc-menuId="1"></div>
			<div class="DRC_zMenuAct" drc-menuId="2"></div>
			<div class="DRC_zMenuAct" drc-menuId="3"></div>
			<div class="DRC_zMenuAct" drc-menuId="4"></div>
		</div>
	</center>
	</div>
	<span class="statusCmd" style="position:absolute;left:5px;bottom:0px;width:30px;z-index:1030;height:30px;"></span>
	<script type="text/javascript">
		(function() {
			var _zones#id# = #zones-json#;
			var _zonesData#id# = #zones-data-json#;
			var _active#id# = '#active-zone-key#';
			if (!_zonesData#id#[_active#id#] && _zones#id#.length) {
				_active#id# = _zones#id#[0].key;
			}
			if (!_zonesData#id#[_active#id#]) {
				_zonesData#id#[_active#id#] = {
					kind: '#active-zone-kind#',
					pow: '#pow-v#',
					powOffId: '#pow-off-id#',
					powOnId: '#pow-on-id#',
					mode: '#mode-v#',
					modeList: #mode-cmd-list#,
					fanMode: '#fan-mode-v#',
					fanRateList: #frate-cmd-list#,
					fanDirList: #fdir-cmd-list#,
					extraList: #extra-cmd-list#,
					stemp: '#stemp-v#',
					stempSliderId: '#stemp-slider-id#',
					stempStep: '#temp-step#',
					powerful: '#powerful-v#',
					powerfulOffId: '#powerful-off-id#',
					powerfulOnId: '#powerful-on-id#',
					sensors: #sensor-info-list#,
					refreshId: '#refresh-id#'
				};
			}
			DRCboot('#id#', _zones#id#, _active#id#, _zonesData#id#, '#background-color#', '#color#');
		})();
	</script>
</div>
