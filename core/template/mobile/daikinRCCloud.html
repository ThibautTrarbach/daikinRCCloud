<!--
  Mobile tile widget for daikinRCCloud — inspired by DaikinOnlineCtrl (AGPL, Masterfion & A.Barrau).
-->
<script type="text/javascript">
var _styleBtnDisabledDRCm = "color:#ADADAD!important;";
function DRCmExec(_id, _opts) {
	if (!_id) { return; }
	var o = _opts || {};
	o.fromWidget = '1';
	jeedom.cmd.execute({id: _id, value: o, notify: true});
}
function DRCmExecItem(_item) {
	if (!_item || !_item.id) { return; }
	if (_item.exec === 'select') { DRCmExec(_item.id, {select: _item.v}); }
	else { DRCmExec(_item.id, {}); }
}
function DRCmSetPow(_eq, _pow, _offId, _onId) {
	var $p = $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_zPow');
	$p.off('click');
	if (_pow === '-1') { return; }
	if (_pow === '1') {
		$p.attr('data-cmd_id', _offId).on('click', function() { DRCmExec($(this).attr('data-cmd_id'), {}); })
			.children().addClass('DRC_btn-pow-on ui-slider-handle').attr('style', 'background-color:#5cb85c!important;color:#FFF!important;');
	} else {
		$p.attr('data-cmd_id', _onId).on('click', function() { DRCmExec($(this).attr('data-cmd_id'), {}); })
			.children().addClass('DRC_btn-pow-off ui-slider-handle').attr('style', 'background-color:#d9534f!important;color:#FFF!important;');
	}
}
function DRCmSetMode(_eq, _pow, _mode, _list) {
	if (!_list) { return; }
	for (var i = 0; i < _list.length; i++) {
		if (String(_list[i].v) === String(_mode)) {
			$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ConsigneIcon').html(_list[i].icone);
			break;
		}
	}
}
function DRCmSetTemp(_eq, _pow, _sliderId, _val, _step) {
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ConsigneTemp').attr('data-tempval', _val).html(_val);
	var step = parseFloat(_step) || 0.5;
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="+"], .eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="-"]').off('click');
	if (_pow != 1) {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_Zone2 .DRC_btn-temp').attr('style', _styleBtnDisabledDRCm);
	}
	if (!_sliderId) { return; }
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="+"]').parent().attr('data-cmd_id', _sliderId).end().on('click', function() {
		var v = parseFloat($('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ConsigneTemp').attr('data-tempval')) + step;
		DRCmExec(_sliderId, {slider: v});
	});
	$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_btn-temp[drc-val="-"]').parent().attr('data-cmd_id', _sliderId).end().on('click', function() {
		var v = parseFloat($('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_ConsigneTemp').attr('data-tempval')) - step;
		DRCmExec(_sliderId, {slider: v});
	});
}
function DRCmSetCmd(_eq, _pow, _list) {
	var $z = $('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_Zone3');
	$z.empty();
	if (!_list || !_list.length) { return; }
	for (var i = 0; i < _list.length; i++) {
		var item = _list[i];
		var $b = $('<span class="cmd" data-cmd_id="' + item.id + '"><a class="action ui-btn ui-mini ui-btn-inline DRC_btn-temp">' + item.icone + '</a></span>&nbsp;');
		$b.data('drcItem', item);
		if (_pow != 1) { $b.find('a').attr('style', _styleBtnDisabledDRCm); }
		if (item.v === '1' || (item.t === 'mode' && false)) {
			$b.find('a').addClass('active ui-slider-handle').attr('style', 'background-color:#5cb85c!important;color:#FFF!important;border-radius:5px!important;');
		}
		$z.append($b);
	}
	$z.find('.cmd').on('click', function() { DRCmExecItem($(this).data('drcItem')); });
}
function DRCmSetInfo(_eq, _sensors) {
	$.each(_sensors, function(k, s) {
		if (s.kcmd === '1') {
			$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_z' + s.n + 'Txt').html(s.v === false ? 'off' : s.v);
		}
	});
}
function DRCmSetOther(_eq, _refreshId, _showPanel) {
	if (_refreshId) {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_Refresh').show().off('click').on('click', function() {
			DRCmExec(_refreshId, {});
		});
	} else {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_Refresh').hide();
	}
	if (_showPanel != '1') {
		$('.eqLogic[data-eqLogic_id=' + _eq + '] .DRC_Zone4').empty();
	}
}
</script>
<style>
.DRC_Refresh { padding-top:3px; margin-right:10px; }
.DRC_Zone1 { position:relative; top:5px; }
.DRC_zPow a { top:-4px; }
.DRC_zTemperature { margin-top:5px; }
.DRC_zTemperature span { display:inline-block; }
.DRC_zsensortemp { padding-left:1px; text-align:left; font-size:85%; }
.DRC_zsensorLabel { padding:0px 1px; text-align:right; font-size:85%; }
.DRC_btn-pow-on { background-color:#5cb85c!important; color:#FFF!important; }
.DRC_btn-pow-off { background-color:#d9534f!important; color:#FFF!important; }
.DRC_Zone2 { margin-top:5px; }
.DRC_Zone2 span { display:inline-block; }
.DRC_btn-temp { background-color:#FFFFFF!important; color:#888888!important; padding:8px 12px!important; margin-right:0px; top:2px; }
.DRC_ConsigneTable { padding:3px 0px; vertical-align:middle; min-width:70px; border-radius:5px; background-color:#FFFFFF; color:#373737; }
.DRC_ConsigneIcon { font-size:20px; padding:0px 5px; }
.DRC_ConsigneTemp { font-size:21px; }
.DRC_Zone3 { margin-top:5px; }
.DRC_Zone4 { margin-top:5px; }
</style>

<div class="eqLogic-widget eqLogic DRC_widget #eqLogic_class#" data-eqTyle="#eqType#" data-eqLogic_id="#id#" data-eqLogic_uid="#uid#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" style="width:#width#;border:#border#;border-radius:#border-radius#;color:#color#;#style#">
	<span class="cmd refresh pull-right cursor DRC_Refresh" style="margin-top:-2px!important;"><i class="fas fa-sync" title="#refresh-txt#"></i></span>
	<center class="widget-name"><span style="#hideEqLogicName#">#name_display# <span class="object_name">#object_name#</span></span></center>
	<center>
		<div class="DRC_TT tooltips">
			<div class="DRC_Zone1">
				<span class="cmd DRC_zPow"><a class="action ui-btn ui-mini ui-btn-inline"><i class="fa fa-power-off"></i></a></span>
				<span class="DRC_zTemperature">
					<span><i class="jeedom jeedom-thermometre-celcius" style="font-size:30px;"></i></span>
					<span style="text-align:right;"><div class="DRC_zsensorLabel">#txt_indoor_min# :</div><div class="DRC_zsensorLabel">#txt_outdoor_min# :</div></span>
					<span style="width:50px;"><div class="DRC_zhtempTxt DRC_zsensortemp">?</div><div class="DRC_zotempTxt DRC_zsensortemp">?</div></span>
				</span>
			</div>
			<div class="DRC_Zone2">
				<span class="cmd"><a class="action ui-btn ui-mini ui-btn-inline DRC_btn-temp" drc-val="+"><i class="fa fa-plus"></i></a></span>
				<span class="cmd"><a class="action ui-btn ui-mini ui-btn-inline DRC_btn-temp" drc-val="-"><i class="fa fa-minus"></i></a></span>
				<span class="DRC_ConsigneTable"><span class="DRC_ConsigneIcon"><i class="jeedom-thermo-moyen"></i></span><span class="DRC_ConsigneTemp">?</span></span>
			</div>
			<div class="DRC_Zone3"></div>
			<div class="DRC_Zone4">
				<a href="#" class="link ui-btn ui-mini ui-btn-inline DRC_btn-temp" data-page="panel" data-plugin="daikinRCCloud" data-title="Daikin ONECTA" data-option="#id#">#txt_showLinkToPanelMobil#</a>
			</div>
		</div>
	</center>
	<span class="statusCmd" style="position:absolute;left:2px;bottom:-3px;width:30px;z-index:1030;"></span>
	<script type="text/javascript">
		var _aModeCmd#id# = #mode-cmd-list#;
		var _aOnMobilCmd#id# = #onmobil-cmd-list#;
		var _aSensorInfo#id# = #sensor-info-list#;
		DRCmSetPow('#id#', '#pow-v#', '#pow-off-id#', '#pow-on-id#');
		DRCmSetMode('#id#', '#pow-v#', '#mode-v#', _aModeCmd#id#);
		DRCmSetTemp('#id#', '#pow-v#', '#stemp-slider-id#', '#stemp-v#', '#temp-step#');
		DRCmSetCmd('#id#', '#pow-v#', _aOnMobilCmd#id#);
		DRCmSetInfo('#id#', _aSensorInfo#id#);
		DRCmSetOther('#id#', '#refresh-id#', '#showLinkToPanelMobil#');
	</script>
</div>
